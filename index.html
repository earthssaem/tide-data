<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>조석 데이터 탐구실</title>
  <meta name="description" content="고등학교 지구과학 조석 자료 분석과 탐구 보고서 작성을 위한 웹앱">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f3a68'/%3E%3Cpath d='M3 19c4-7 7-7 10 0s6 7 10 0 5-6 6-4' fill='none' stroke='%237fd3d4' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
  <!-- 전체화면 평가 모드(독립 모듈) -->
  <link rel="stylesheet" href="css/assessment.css">
</head>
<body>
  <a class="skip-link" href="#screen">본문으로 건너뛰기</a>
  <div id="app" class="app">
    <header class="topbar" id="topbar">
      <button type="button" class="brand" id="brand-home" title="처음 화면으로">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">조석 데이터 탐구실</span>
      </button>
      <nav class="stepper" id="stepper" aria-label="탐구 단계"></nav>
      <div class="top-tools">
        <div class="save-status" id="save-status" role="status" aria-live="polite"></div>
        <details class="menu" id="tools-menu">
          <summary class="btn btn-ghost btn-sm">저장·백업</summary>
          <div class="menu-panel">
            <p class="menu-note">임시 저장은 현재 컴퓨터와 브라우저에 보관됩니다.</p>
            <button type="button" class="btn btn-secondary btn-sm" data-action="backup">작성 내용 백업 파일 받기</button>
            <button type="button" class="btn btn-secondary btn-sm" data-action="import">백업 파일 불러오기</button>
            <button type="button" class="btn btn-danger-outline btn-sm" data-action="clear">이 컴퓨터의 내 작성 내용 삭제</button>
          </div>
        </details>
      </div>
    </header>
    <div class="sample-banner" id="sample-banner" hidden></div>
    <div class="save-error" id="save-error" role="alert" hidden></div>
    <div class="context-bar" id="context-bar" hidden></div>
    <main id="screen" class="screen" tabindex="-1">
      <div class="loading" id="loading">자료를 불러오는 중입니다…</div>
    </main>
    <nav class="bottom-nav" id="bottom-nav" aria-label="단계 이동" hidden></nav>
  </div>
  <div id="toast-host" class="toast-host" aria-live="polite"></div>
  <noscript><p class="noscript">이 앱은 자바스크립트가 필요합니다.</p></noscript>
  <!-- 전체화면 평가 모드는 앱보다 먼저 실행되어 평가 시작 전에는 콘텐츠를 가린다 -->
  <script type="module" src="js/assessment/assessment-mode.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
